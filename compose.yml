name: shards
x-backend: &backend
  build: ./backend
  env_file: ['${SHARDS_ENV_FILE:-.env}']
  environment:
    NODE_ENV: production
    PORT: 5199
    SHARDS_CHECKOUT_ENABLED: '${SHARDS_CHECKOUT_ENABLED:-false}'
    SHARDS_PAYMENTS_ENABLED: '${SHARDS_PAYMENTS_ENABLED:-false}'
    SHARDS_FULFILLMENT_ENABLED: '${SHARDS_FULFILLMENT_ENABLED:-false}'
  volumes: ['./secrets:/run/secrets:ro']
  restart: unless-stopped
  profiles: [app]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_started}
services:
  postgres:
    image: postgres:17-alpine
    profiles: [app]
    environment:
      POSTGRES_DB: shards
      POSTGRES_USER: shards
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes: ['shards-postgres:/var/lib/postgresql/data', './secrets:/run/secrets:ro']
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shards -d shards']
      interval: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    profiles: [app]
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['shards-redis:/data']
    restart: unless-stopped
  api:
    <<: *backend
    ports: ['127.0.0.1:5199:5199']
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:5199/health/ready").then(r=>r.json()).then(r=>process.exit(r.status==="ok"?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      retries: 5
  frontend:
    profiles: [app]
    build: ./frontend
    ports: ['127.0.0.1:5198:5198']
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
  fulfillment:
    <<: *backend
    command: ['node', 'dist/fulfillment-worker.js']
  notifications:
    <<: *backend
    command: ['node', 'dist/notifications-worker.js']
  vv-admin:
    <<: *backend
    command: ['node', 'dist/vv-admin-dispatcher-worker.js']
  catalog:
    <<: *backend
    environment:
      NODE_ENV: production
      CATALOG_SYNC_WORKER_INTERVAL_MS: 300000
      SHARDS_CHECKOUT_ENABLED: 'false'
      SHARDS_PAYMENTS_ENABLED: 'false'
      SHARDS_FULFILLMENT_ENABLED: 'false'
    command: ['node', 'dist/catalog-sync-worker.js']
  reconciliation:
    <<: *backend
    command: ['sh', '-c', 'while true; do node dist/payments-reconcile.js --limit=40; node dist/wallet-reconcile.js --limit=100; sleep 60; done']
volumes:
  shards-postgres:
  shards-redis:
