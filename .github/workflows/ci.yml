name: Shards CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm --prefix backend ci
      - run: npm --prefix frontend ci
      - run: npm run verify
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm --prefix frontend run test:e2e
      - run: npm --prefix frontend run visual:baseline
      - run: npm --prefix frontend run visual:compare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shards-browser-evidence
          path: |
            .qa/visual-current
            .qa/visual-baseline-platform
            frontend/test-results
